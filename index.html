<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How to log a customer activity in Odoo | BTL</title>
<style>
  :root {
    /* BTL blue sampled from the logo (about #275D91) */
    --btl-blue: #275D91;
    --navy: #12294A;
    --glass: rgba(255,255,255,.09);
    --glass-done: rgba(10,25,48,.35);
    --border: rgba(255,255,255,.28);
    --text: #FFFFFF;
    --muted: #E1E9F3;
    --accent: #FFD166;
    --focus: #FFD166;
  }
  * { box-sizing: border-box; }
  html { background: var(--navy); }
  body {
    margin: 0; min-height: 100vh;
    background: linear-gradient(160deg, var(--btl-blue) 0%, #1B4573 45%, var(--navy) 100%);
    color: var(--text);
    font-family: "Inter", -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.55;
  }
  main { max-width: 780px; margin: 0 auto; padding: 40px 20px 72px; }
  header { text-align: center; margin-bottom: 32px; }
  .logo { height: 84px; width: auto; display: inline-block; }
  h1 { font-size: clamp(1.6rem, 4vw, 2.2rem); margin: 22px 0 0; line-height: 1.2; letter-spacing: -.01em; }

  .rule {
    background: #fff; color: #12294A;
    border-radius: 20px; padding: 20px 24px 20px 28px;
    margin-bottom: 28px; position: relative; overflow: hidden;
    box-shadow: 0 10px 30px rgba(8,20,40,.35);
  }
  .rule::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 8px; background: linear-gradient(180deg, #FFD166, #F4A261); }
  .rule .label { font-size: .75rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #3A5A85; }
  .rule p { margin: 4px 0 0; font-size: 1.2rem; font-weight: 700; }

  .progress { margin-bottom: 18px; }
  .progress-row { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: .95rem; margin-bottom: 8px; }
  .bar { height: 10px; background: rgba(10,25,48,.4); border-radius: 999px; overflow: hidden; }
  .bar > div { height: 100%; width: 0; border-radius: 999px; background: linear-gradient(90deg, #8FC1F0, #FFFFFF); transition: width .3s ease; }
  button.reset {
    background: var(--glass); border: 1px solid var(--border); color: var(--text);
    border-radius: 999px; padding: 6px 16px; font: inherit; font-size: .9rem; cursor: pointer;
  }
  button.reset:hover { background: rgba(255,255,255,.18); }
  button.reset:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  ol.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
  .step {
    display: flex; gap: 16px; align-items: flex-start;
    background: var(--glass); border: 1px solid var(--border); border-radius: 20px;
    padding: 18px 20px; cursor: pointer;
    box-shadow: 0 6px 18px rgba(8,20,40,.22);
    transition: transform .15s ease, background .15s ease, border-color .15s ease;
  }
  .step:hover { transform: translateY(-2px); background: rgba(255,255,255,.14); border-color: rgba(255,255,255,.6); }
  .step.done { background: var(--glass-done); box-shadow: none; }
  .step.done .body { color: var(--muted); }
  .step input { position: absolute; opacity: 0; pointer-events: none; }
  .box {
    flex: none; width: 30px; height: 30px; border: 2px solid #fff; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
    transition: background .15s ease;
  }
  .box svg { width: 18px; height: 18px; visibility: hidden; }
  .step.done .box { background: #fff; }
  .step.done .box svg { visibility: visible; }
  .step:focus-within { outline: 3px solid var(--focus); outline-offset: 3px; }
  .num { display: block; font-size: .75rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .body p { margin: 2px 0 0; }
  .body ul { margin: 10px 0 0; padding-left: 20px; }
  .body li { margin: 6px 0; }
  .note { margin-top: 8px !important; font-size: .95rem; color: var(--muted); }
  .stop {
    margin-top: 10px !important; font-weight: 600; font-size: .95rem;
    display: inline-block; padding: 6px 12px; border-radius: 12px;
    background: rgba(255,209,102,.18); border: 1px solid rgba(255,209,102,.6);
  }
  strong { font-weight: 700; }

  .complete {
    display: none; margin-top: 18px; padding: 18px; border-radius: 20px;
    background: #fff; color: #12294A; font-weight: 700; text-align: center;
    box-shadow: 0 10px 30px rgba(8,20,40,.35);
  }
  .complete.show { display: block; }

  section.mistakes { margin-top: 40px; }
  h2 { font-size: 1.3rem; margin: 0 0 14px; }
  .mistakes ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .mistakes li {
    padding: 14px 18px 14px 56px; position: relative;
    background: var(--glass); border: 1px solid var(--border); border-radius: 16px;
  }
  .mistakes li::before {
    content: "\2715"; position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
    width: 28px; height: 28px; border-radius: 50%; background: rgba(255,209,102,.9); color: #12294A;
    display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: .85rem;
  }
  footer { margin-top: 44px; color: var(--muted); font-size: .85rem; text-align: center; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  @media print { html, body { background: #fff; color: #000; } }

  .lang { display: flex; justify-content: flex-end; margin-bottom: 8px; }
  .lang .seg { display: inline-flex; background: rgba(10,25,48,.4); border-radius: 999px; padding: 3px; }
  .lang button {
    background: none; border: 0; color: var(--text); font: inherit; font-size: .85rem; font-weight: 600;
    padding: 5px 14px; border-radius: 999px; cursor: pointer;
  }
  .lang button[aria-pressed="true"] { background: #fff; color: #12294A; }
  .lang button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
</style>
</head>

  <div class="complete" id="complete"></div>

  <section class="mistakes">
    <h2 id="t-mistakes"></h2>
    <ul id="mistakes"></ul>
  </section>

  <footer id="t-footer"></footer>
</main>

<script>
  const LANGS = {
    en: {
      htmlLang: "en",
      docTitle: "How to log a customer activity in Odoo | BTL",
      title: "How to log a customer activity in Odoo",
      ruleLabel: "The rule",
      rule: "Never create a meeting directly in the Calendar app or in Google Calendar. Always start from the contact.",
      count: (n, t) => `${n} of ${t} steps done`,
      reset: "Reset checklist",
      step: "Step",
      complete: "All done. Activity logged correctly.",
      mistakesTitle: "Common mistakes",
      mistakes: [
        "Creating events directly in Google Calendar.",
        "Vague titles such as \u201cMeeting\u201d or \u201cVisit.\u201d",
        "Logging the activity on the company when you are meeting a specific person.",
        "Logging activities at the end, instead of as they happen."
      ],
      footer: "Tick the steps as you go. Your progress is saved in this browser only.",
      steps: [
        `<p>Open <strong>Contacts</strong> in Odoo.</p>`,
        `<p>Find who you are meeting. Search by name or company, then open the <strong>person's own record</strong> under the company.</p>
         <p class="note">No specific person, for example a cold visit? Log it on the <strong>company record</strong> instead, and say who you spoke to (if anyone) in the description.</p>`,
        `<p>Click the <strong>Activities</strong> button at the top of the contact form.</p>`,
        `<p>Add a new activity and choose the <strong>Meeting/Visit</strong> type.</p>
         <p class="note">For calls, training, or other work, choose the matching type: Call, Training, Prospecting, Installation, Business trip, Email, or Congress/Event. Use To Do only if nothing else fits.</p>`,
        `<p>Fill in:</p>
         <ul>
           <li><strong>Title:</strong> what the activity is and who or what it's about, for example \u201cInstallation follow-up, Cl\u00ednica S\u00e3o Dinis.\u201d</li>
           <li><strong>Date and time:</strong> the actual start time.</li>
           <li><strong>Assigned to:</strong> the employee doing the activity.</li>
           <li><strong>Description:</strong> what was discussed, the goal, or what's needed next.</li>
         </ul>`,
        `<p><strong>Save.</strong></p>`,
        `<p>Open the <strong>Calendar</strong> app and check that the event appears with its title and details, not just \u201cGoogle Event.\u201d</p>
         <p class="stop">If it doesn't, stop and tell your manager before logging more activities.</p>`,
        `<p>After the activity, <strong>mark it as done</strong> and add a short note on the outcome.</p>
         <p class="note">If a follow-up is needed, create a new activity from the same contact.</p>`
      ]
    },
    pt: {
      htmlLang: "pt-PT",
      docTitle: "Como registar uma atividade de cliente no Odoo | BTL",
      title: "Como registar uma atividade de cliente no Odoo",
      ruleLabel: "A regra",
      rule: "Nunca crie uma reuni\u00e3o diretamente na app Calend\u00e1rio nem no Google Calendar. Comece sempre pelo contacto.",
      count: (n, t) => `${n} de ${t} passos conclu\u00eddos`,
      reset: "Reiniciar lista",
      step: "Passo",
      complete: "Tudo pronto. Atividade registada corretamente.",
      mistakesTitle: "Erros comuns",
      mistakes: [
        "Criar eventos diretamente no Google Calendar.",
        "T\u00edtulos vagos, como \u201cReuni\u00e3o\u201d ou \u201cVisita.\u201d",
        "Registar a atividade na empresa quando se reúne com uma pessoa concreta.",
        "Registar as atividades s\u00f3 no fim, em vez de as registar \u00e0 medida que acontecem."
      ],
      footer: "Marque os passos \u00e0 medida que avan\u00e7a. O seu progresso fica guardado apenas neste navegador.",
      steps: [
        `<p>Abra <strong>Contactos (Contacts)</strong> no Odoo.</p>`,
        `<p>Encontre a pessoa com quem vai reunir. Pesquise por nome ou empresa e abra a <strong>ficha da pr\u00f3pria pessoa</strong>, por baixo da empresa.</p>
         <p class="note">N\u00e3o h\u00e1 uma pessoa concreta, por exemplo numa visita sem marca\u00e7\u00e3o (cold visit)? Registe na <strong>ficha da empresa</strong> e indique na descri\u00e7\u00e3o com quem falou (se for o caso).</p>`,
        `<p>Clique no bot\u00e3o <strong>Atividades (Activities)</strong> no topo da ficha de contacto.</p>`,
        `<p>Adicione uma nova atividade e escolha o tipo <strong>Meeting/Visit</strong> (reuni\u00e3o/visita).</p>
         <p class="note">Para chamadas, forma\u00e7\u00f5es ou outro trabalho, escolha o tipo correspondente: Call, Training, Prospecting, Installation, Business trip, Email ou Congress/Event. Use To Do apenas se nenhum outro servir. Os nomes dos tipos est\u00e3o escritos como aparecem no Odoo.</p>`,
        `<p>Preencha:</p>
         <ul>
           <li><strong>T\u00edtulo (Title):</strong> o que \u00e9 a atividade e com quem ou sobre o qu\u00ea, por exemplo \u201cAcompanhamento da instala\u00e7\u00e3o, Cl\u00ednica S\u00e3o Dinis.\u201d</li>
           <li><strong>Data e hora (Date and time):</strong> a hora real de in\u00edcio.</li>
           <li><strong>Atribu\u00eddo a (Assigned to):</strong> o colaborador que realiza a atividade.</li>
           <li><strong>Descri\u00e7\u00e3o (Description):</strong> o que foi discutido, o objetivo ou o que \u00e9 preciso a seguir.</li>
         </ul>`,
        `<p><strong>Guarde (Save).</strong></p>`,
        `<p>Abra a app <strong>Calend\u00e1rio (Calendar)</strong> e confirme que o evento aparece com o t\u00edtulo e os detalhes, e n\u00e3o apenas \u201cGoogle Event\u201d.</p>
         <p class="stop">Se n\u00e3o aparecer, pare e avise o seu respons\u00e1vel antes de registar mais atividades.</p>`,
        `<p>Depois da atividade, <strong>marque-a como conclu\u00edda (mark as done)</strong> e acrescente uma nota curta sobre o resultado.</p>
         <p class="note">Se for preciso um seguimento, crie uma nova atividade a partir do mesmo contacto.</p>`
      ]
    }
  };

  const KEY = "btl-odoo-checklist-v1";
  const LKEY = "btl-odoo-lang";
  let done = [];
  try { done = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) {}
  if (!Array.isArray(done)) done = [];
  let lang = null;
  try { lang = localStorage.getItem(LKEY); } catch (e) {}
  if (!LANGS[lang]) lang = (navigator.language || "").toLowerCase().startsWith("pt") ? "pt" : "en";

  const list = document.getElementById("steps");
  const check = '<svg viewBox="0 0 20 20" fill="none" stroke="#12294A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5l4 4 8-9"/></svg>';
  const $ = id => document.getElementById(id);

  function save() { try { localStorage.setItem(KEY, JSON.stringify(done)); } catch (e) {} }

  function render() {
    const L = LANGS[lang];
    document.documentElement.lang = L.htmlLang;
    document.title = L.docTitle;
    $("t-title").textContent = L.title;
    $("t-rule-label").textContent = L.ruleLabel;
    $("t-rule").textContent = L.rule;
    $("reset").textContent = L.reset;
    $("complete").textContent = L.complete;
    $("t-mistakes").textContent = L.mistakesTitle;
    $("t-footer").textContent = L.footer;
    $("mistakes").innerHTML = L.mistakes.map(m => `<li>${m}</li>`).join("");
    document.querySelectorAll(".lang button").forEach(b =>
      b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));

    list.innerHTML = L.steps.map((html, i) => `<li><label class="step" id="s${i}">
        <input type="checkbox" data-i="${i}" aria-label="${L.step} ${i + 1}">
        <span class="box">${check}</span>
        <span class="body"><span class="num">${L.step} ${i + 1}</span>${html}</span>
      </label></li>`).join("");
    L.steps.forEach((_, i) => {
      const el = $("s" + i);
      const on = done.includes(i);
      el.classList.toggle("done", on);
      el.querySelector("input").checked = on;
    });
    const n = done.length;
    $("count").textContent = L.count(n, L.steps.length);
    $("fill").style.width = (n / L.steps.length * 100) + "%";
    $("complete").classList.toggle("show", n === L.steps.length);
  }

  list.addEventListener("change", e => {
    const i = +e.target.dataset.i;
    done = e.target.checked ? [...new Set([...done, i])] : done.filter(x => x !== i);
    save();
    const el = $("s" + i), on = done.includes(i);
    el.classList.toggle("done", on);
    const L = LANGS[lang], n = done.length;
    $("count").textContent = L.count(n, L.steps.length);
    $("fill").style.width = (n / L.steps.length * 100) + "%";
    $("complete").classList.toggle("show", n === L.steps.length);
  });
  $("reset").addEventListener("click", () => { done = []; save(); render(); });
  document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => {
    lang = b.dataset.lang;
    try { localStorage.setItem(LKEY, lang); } catch (e) {}
    render();
  }));
  render();
</script>
</body>
</html>
