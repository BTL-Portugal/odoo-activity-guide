<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12294A">
<title>How to log a customer meeting in Odoo | BTL</title>
<style>
  :root {
    --navy: #12294A;
    --navy-2: #1C3A63;
    --accent: #FFD166;
    --ink: #12294A;
    --ink-soft: #4A5C77;
    --line: #DFE5EE;
    --bg: #F3F6FA;
    --card: #FFFFFF;
    --radius: 18px;
    --shadow: 0 1px 2px rgba(18,41,74,.06), 0 6px 20px rgba(18,41,74,.07);
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--font); font-size: 17px; line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  body.locked { overflow: hidden; }
  strong { font-weight: 700; }
  .wrap { max-width: 880px; margin: 0 auto; padding: 0 20px; }
  :focus-visible { outline: 3px solid var(--navy); outline-offset: 3px; border-radius: 6px; }

  /* Header */
  .site-head {
    background: radial-gradient(120% 140% at 85% -20%, #2A5487 0%, var(--navy) 55%) var(--navy);
    color: #fff; padding: 18px 0 84px;
  }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand img { height: 40px; width: auto; display: block; }
  .brand span {
    font-size: .78rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase;
    color: rgba(255,255,255,.75); padding-left: 14px; border-left: 1px solid rgba(255,255,255,.25);
  }
  .lang { display: inline-flex; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.2); border-radius: 999px; padding: 3px; }
  .lang button {
    background: none; border: 0; color: #fff; font: inherit; font-size: .85rem; font-weight: 700;
    min-width: 46px; padding: 6px 12px; border-radius: 999px; cursor: pointer; letter-spacing: .04em;
  }
  .lang button[aria-pressed="true"] { background: #fff; color: var(--navy); }
  .site-head :focus-visible { outline-color: var(--accent); }
  .site-head h1 {
    font-size: clamp(1.75rem, 4.6vw, 2.6rem); line-height: 1.15; letter-spacing: -.02em;
    margin: 44px 0 10px; max-width: 18em;
  }
  .site-head .lede { margin: 0; color: rgba(255,255,255,.8); font-size: 1.05rem; max-width: 34em; }

  /* Rule callout */
  .rule {
    position: relative; margin-top: -52px; background: var(--card); border-radius: var(--radius);
    box-shadow: 0 12px 34px rgba(18,41,74,.16); padding: 22px 24px 22px 24px;
    display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: start; overflow: hidden;
  }
  .rule::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 6px; background: var(--accent); }
  .rule .icon {
    width: 44px; height: 44px; border-radius: 50%; background: var(--accent); color: var(--navy);
    display: grid; place-items: center; margin-left: 4px;
  }
  .rule .icon svg { width: 24px; height: 24px; }
  .rule .label { font-size: .75rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft); }
  .rule p { margin: 2px 0 0; font-size: clamp(1.08rem, 2.4vw, 1.3rem); font-weight: 700; line-height: 1.4; }

  /* Progress */
  .progress {
    position: sticky; top: 0; z-index: 5; margin: 28px -20px 18px; padding: 12px 20px;
    background: rgba(243,246,250,.88); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  }
  .progress-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 8px; }
  #count { font-weight: 700; font-size: .95rem; }
  .reset {
    background: var(--card); border: 1px solid var(--line); color: var(--ink); border-radius: 999px;
    padding: 6px 14px; font: inherit; font-size: .85rem; font-weight: 600; cursor: pointer;
  }
  .reset:hover { border-color: var(--navy); }
  .bar { height: 10px; background: #E2E8F1; border-radius: 999px; overflow: hidden; }
  .bar > div {
    height: 100%; width: 0; border-radius: 999px;
    background: linear-gradient(90deg, var(--navy), #2A5487 60%, var(--accent));
    background-size: 200% 100%; transition: width .45s cubic-bezier(.2,.8,.2,1);
  }

  /* Steps */
  ol.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
  .step {
    display: grid; grid-template-columns: 1fr 188px; gap: 20px; align-items: start;
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 20px; box-shadow: var(--shadow); transition: border-color .2s, background .2s, box-shadow .2s;
  }
  .step:hover { border-color: #C5CFDD; }
  .step.done { background: #F8FAFC; box-shadow: none; }
  .tick { display: grid; grid-template-columns: 56px 1fr; gap: 16px; cursor: pointer; min-width: 0; }
  .tick input { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; }
  .badge {
    width: 56px; height: 56px; border-radius: 16px; border: 2px solid var(--navy); color: var(--navy);
    display: grid; place-items: center; font-size: 1.7rem; font-weight: 800; letter-spacing: -.02em;
    font-variant-numeric: tabular-nums; position: relative; transition: background .2s, color .2s;
  }
  .badge svg { position: absolute; width: 28px; height: 28px; opacity: 0; transform: scale(.6); transition: opacity .2s, transform .2s; }
  .step.done .badge { background: var(--navy); color: transparent; }
  .step.done .badge svg { opacity: 1; transform: none; }
  .tick:has(input:focus-visible) .badge { outline: 3px solid var(--navy); outline-offset: 3px; }
  .tick:hover .badge { box-shadow: 0 0 0 4px rgba(255,209,102,.55); }
  .kicker { display: flex; align-items: center; gap: 10px; font-size: .75rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft); }
  .kicker .mark { font-weight: 600; letter-spacing: .02em; text-transform: none; color: #7A8AA2; font-size: .8rem; }
  .step.done .kicker .mark { color: var(--navy); }
  .body p { margin: 4px 0 0; }
  .body ul { margin: 8px 0 0; padding-left: 20px; }
  .body li { margin: 6px 0; }
  .body li::marker { color: #8C9BB2; }
  .step.done .body { color: var(--ink-soft); }
  .note { margin-top: 10px !important; font-size: .93rem; color: var(--ink-soft); padding-left: 12px; border-left: 3px solid var(--line); }
  .stop {
    margin-top: 12px !important; font-weight: 700; font-size: .95rem; color: #7A2E0E;
    padding: 10px 14px; border-radius: 12px; background: #FFF1EC; border: 1px solid #F6B9A3;
    display: flex; gap: 10px; align-items: flex-start;
  }
  .stop::before { content: "!"; flex: none; width: 22px; height: 22px; border-radius: 50%; background: #C2410C; color: #fff; display: grid; place-items: center; font-size: .8rem; margin-top: 1px; }

  /* Thumbnail button */
  .peek {
    position: relative; display: block; width: 100%; padding: 0; border: 1px solid var(--line); border-radius: 12px;
    background: #E9EEF5; cursor: zoom-in; overflow: hidden; aspect-ratio: 2932 / 1494;
    box-shadow: 0 1px 2px rgba(18,41,74,.08); transition: transform .2s, box-shadow .2s;
  }
  .peek:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(18,41,74,.16); }
  .peek img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .peek .hs { position: absolute; border: 2px solid var(--accent); border-radius: 3px; box-shadow: 0 0 0 1px rgba(18,41,74,.55); pointer-events: none; }
  .peek .cta {
    position: absolute; right: 8px; bottom: 8px; display: inline-flex; align-items: center; gap: 6px;
    background: var(--navy); color: #fff; font-size: .78rem; font-weight: 700; padding: 5px 10px 5px 6px; border-radius: 999px;
    box-shadow: 0 2px 8px rgba(18,41,74,.35);
  }
  .peek .cta i { width: 18px; height: 18px; border-radius: 50%; background: var(--accent); color: var(--navy); display: grid; place-items: center; font-style: normal; font-weight: 800; line-height: 1; }

  .complete {
    display: none; margin-top: 16px; padding: 18px 20px; border-radius: var(--radius);
    background: var(--navy); color: #fff; font-weight: 700; text-align: center;
  }
  .complete.show { display: block; animation: pop .35s ease; }
  @keyframes pop { from { transform: scale(.97); opacity: 0; } }

  /* Inline Odoo-style icons */
  .ico { display: inline-flex; vertical-align: -0.16em; width: 1.15em; height: 1.15em; }
  .ico svg { width: 100%; height: 100%; }
  .key {
    display: inline-flex; align-items: center; gap: 4px; padding: 0 6px; border-radius: 6px;
    background: #EEF2F7; border: 1px solid var(--line); font-weight: 700; white-space: nowrap;
  }
  .body a, footer a, .info a { color: var(--navy); font-weight: 600; text-underline-offset: 2px; }

  /* Secondary sections */
  section.more { margin-top: 48px; }
  .sub { margin: -6px 0 16px; color: var(--ink-soft); }
  .fu {
    display: grid; grid-template-columns: 1fr 188px; gap: 20px; align-items: start;
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow);
  }
  .fu ol { margin: 0; padding: 0; list-style: none; counter-reset: fu; display: grid; gap: 12px; }
  .fu ol > li { counter-increment: fu; display: grid; grid-template-columns: 30px 1fr; gap: 12px; }
  .fu ol > li::before {
    content: counter(fu); width: 30px; height: 30px; border-radius: 9px; background: #EEF2F7; color: var(--navy);
    display: grid; place-items: center; font-weight: 800; font-size: .95rem; margin-top: 1px;
  }
  .fu ol p { margin: 0; }
  .fu .note { grid-column: 1 / -1; }
  .info { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  .info > div { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px; }
  .info h3 { margin: 0 0 6px; font-size: 1.02rem; display: flex; align-items: center; gap: 10px; }
  .info h3 .ico { width: 30px; height: 30px; padding: 6px; border-radius: 9px; background: var(--navy); color: var(--accent); }
  .info p { margin: 0; font-size: .95rem; color: var(--ink-soft); }
  .info ul { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 7px; font-size: .95rem; }
  .info li { display: flex; align-items: center; gap: 10px; }
  .info li .ico { flex: none; width: 26px; height: 26px; padding: 5px; border-radius: 8px; background: #EEF2F7; color: var(--navy); }
  .dot { flex: none; width: 14px; height: 14px; border-radius: 50%; margin: 0 6px; }
  .dot.g { background: #28A745; } .dot.o { background: #F0AD4E; } .dot.r { background: #DC3545; }

  /* Mistakes */
  section.mistakes { margin-top: 44px; }
  h2 { font-size: 1.35rem; letter-spacing: -.01em; margin: 0 0 14px; }
  .mistakes ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .mistakes li {
    display: grid; grid-template-columns: 28px 1fr; gap: 14px; align-items: center;
    padding: 14px 18px; background: var(--card); border: 1px solid var(--line); border-radius: 14px;
  }
  .mistakes li::before {
    content: "\2715"; width: 28px; height: 28px; border-radius: 50%; background: #FDECE5; color: #C2410C;
    display: grid; place-items: center; font-weight: 800; font-size: .78rem;
  }
  footer { margin: 40px 0 0; padding: 24px 0 48px; color: var(--ink-soft); font-size: .88rem; text-align: center; border-top: 1px solid var(--line); }

  /* Viewer */
  .viewer { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 12px; }
  .viewer[hidden] { display: none; }
  .backdrop { position: absolute; inset: 0; background: rgba(8,18,34,.82); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); animation: fade .2s ease; }
  .dialog { position: relative; display: flex; flex-direction: column; gap: 10px; align-items: center; animation: rise .25s ease; }
  @keyframes fade { from { opacity: 0; } }
  @keyframes rise { from { opacity: 0; transform: translateY(8px) scale(.985); } }
  .stage {
    --ratio: 1.9625;
    position: relative; margin: 0; border-radius: 10px; overflow: hidden; background: #0B1A30;
    width: min(calc(100vw - 24px), calc((100vh - 150px) * var(--ratio)));
    width: min(calc(100vw - 24px), calc((100dvh - 150px) * var(--ratio)));
    aspect-ratio: 2932 / 1494; box-shadow: 0 20px 60px rgba(0,0,0,.45); touch-action: pan-y;
  }
  .stage img { position: absolute; display: block; max-width: none; -webkit-user-drag: none; user-select: none; }
  .stage .base { inset: 0; width: 100%; height: 100%; filter: grayscale(.9) brightness(.45) contrast(.9); transition: opacity .18s; }
  .stage.loading .base, .stage.loading .spot { opacity: 0; }
  .spot {
    position: absolute; overflow: hidden; border-radius: 4px; transition: opacity .18s;
    box-shadow: 0 0 0 3px var(--accent), 0 0 0 5px rgba(18,41,74,.7), 0 0 18px 6px rgba(255,209,102,.55);
    animation: glow 1.8s ease-in-out infinite;
  }
  .spot img { left: 0; top: 0; }
  @keyframes glow {
    50% { box-shadow: 0 0 0 3px var(--accent), 0 0 0 5px rgba(18,41,74,.7), 0 0 34px 14px rgba(255,209,102,.28); }
  }
  .caption {
    width: 100%; max-width: 760px; display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center;
    background: var(--card); color: var(--ink); border-radius: 14px; padding: 10px 12px; box-shadow: 0 10px 30px rgba(0,0,0,.3);
  }
  .caption .txt { min-width: 0; text-align: center; }
  #v-count { display: block; font-size: .72rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft); }
  #v-text { margin: 0; font-weight: 600; font-size: .98rem; line-height: 1.4; }
  .v-btn {
    width: 46px; height: 46px; border-radius: 50%; border: 0; cursor: pointer; flex: none;
    background: var(--navy); color: #fff; display: grid; place-items: center; transition: background .15s, opacity .15s;
  }
  .v-btn svg { width: 22px; height: 22px; }
  .v-btn:hover:not(:disabled) { background: var(--navy-2); }
  .v-btn:disabled { opacity: .25; cursor: default; }
  .v-close { position: fixed; top: 12px; right: 12px; background: rgba(255,255,255,.14); z-index: 2; }
  .v-close:hover { background: rgba(255,255,255,.26) !important; }
  .viewer :focus-visible { outline-color: var(--accent); }
  .viewer.single .v-nav, .viewer.single .hint { visibility: hidden; }
  .hint { font-size: .78rem; color: rgba(255,255,255,.6); margin: 0; }

  @media (max-width: 680px) {
    body { font-size: 16px; }
    .site-head { padding-bottom: 76px; }
    .site-head h1 { margin-top: 30px; }
    .brand img { height: 32px; }
    .brand span { display: none; }
    .rule { grid-template-columns: 1fr; gap: 10px; padding: 18px 18px 18px 22px; }
    .rule .icon { width: 36px; height: 36px; margin: 0; }
    .step { grid-template-columns: 1fr; gap: 14px; padding: 16px; }
    .tick { grid-template-columns: 46px 1fr; gap: 12px; }
    .badge { width: 46px; height: 46px; font-size: 1.4rem; border-radius: 13px; }
    .peek { max-width: 100%; }
    .fu { grid-template-columns: 1fr; padding: 16px; }
    .info { grid-template-columns: 1fr; }
    .hint { display: none; }
    .v-btn { width: 42px; height: 42px; }
  }
  @media (min-width: 681px) {
    .stage {
      width: min(calc(100vw - 132px), calc((100vh - 150px) * var(--ratio)));
      width: min(calc(100vw - 132px), calc((100dvh - 150px) * var(--ratio)));
    }
  }
  @media (max-height: 520px) {
    .hint { display: none; }
    .viewer { padding: 8px; }
    .dialog { gap: 6px; }
    .stage {
      width: min(calc(100vw - 132px), calc((100vh - 84px) * var(--ratio)));
      width: min(calc(100vw - 132px), calc((100dvh - 84px) * var(--ratio)));
    }
    .caption { padding: 6px 10px; }
    .v-btn { width: 38px; height: 38px; }
  }
  @media (hover: none) { .hint { display: none; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
  @media print {
    .site-head { background: #fff; color: #000; padding-bottom: 20px; }
    .progress, .peek, .lang, .viewer { display: none !important; }
    .fu { grid-template-columns: 1fr; }
    .rule { margin-top: 0; box-shadow: none; border: 1px solid #ccc; }
    .step { grid-template-columns: 1fr; box-shadow: none; break-inside: avoid; }
  }
</style>
</head>

  const KEY = "btl-odoo-checklist-v3";
  const LKEY = "btl-odoo-lang";
  const TOTAL = STEPS;
  let done = [];
  try { done = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) {}
  if (!Array.isArray(done)) done = [];
  done = done.filter(i => Number.isInteger(i) && i >= 0 && i < TOTAL);
  let lang = null;
  try { lang = localStorage.getItem(LKEY); } catch (e) {}
  if (!LANGS[lang]) lang = (navigator.language || "").toLowerCase().startsWith("pt") ? "pt" : "en";

  const $ = id => document.getElementById(id);
  const list = $("steps");
  const checkSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="#FFD166" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  const boxes = (i, cls) => SHOTS[i].spots.map(([l, t, w, h]) =>
    `<span class="${cls}" style="left:${l}%;top:${t}%;width:${w}%;height:${h}%"></span>`).join("");

  function save() { try { localStorage.setItem(KEY, JSON.stringify(done)); } catch (e) {} }

  function updateProgress() {
    const L = LANGS[lang], n = done.length;
    $("count").textContent = L.count(n, TOTAL);
    $("fill").style.width = (n / TOTAL * 100) + "%";
    $("complete").classList.toggle("show", n === TOTAL);
    list.querySelectorAll(".step").forEach((el, i) => {
      const on = done.includes(i);
      el.classList.toggle("done", on);
      el.querySelector("input").checked = on;
      el.querySelector(".mark").textContent = on ? "✓ " + L.tapDone : L.tap;
    });
  }

  function render() {
    const L = LANGS[lang];
    document.documentElement.lang = L.htmlLang;
    document.title = L.docTitle;
    $("t-kicker").textContent = L.kicker;
    $("t-title").textContent = L.title;
    $("t-lede").textContent = L.lede;
    $("t-rule-label").textContent = L.ruleLabel;
    $("t-rule").textContent = L.rule;
    $("reset").textContent = L.reset;
    $("complete").textContent = L.complete;
    $("t-mistakes").textContent = L.mistakesTitle;
    $("t-footer").textContent = L.footer;
    $("t-source").innerHTML = L.source;
    $("t-follow").textContent = L.followTitle;
    $("t-follow-lede").textContent = L.followLede;
    $("followup").innerHTML = `<div><ol>${L.follow.map(t => `<li><p>${t}</p></li>`).join("")}</ol>
        <p class="note">${L.followNote}</p></div>
      <button type="button" class="peek" data-shot="${FOLLOW}" aria-label="${L.followShort}">
        <img src="${thumb(FOLLOW)}" alt="${L.followAlt}" loading="lazy" decoding="async" width="640" height="326">
        ${boxes(FOLLOW, "hs")}
        <span class="cta" aria-hidden="true"><i>+</i>${L.showMe}</span>
      </button>`;
    $("t-know").textContent = L.knowTitle;
    $("know").innerHTML = L.know.map(k => `<div><h3>${I[k.icon]}${k.title}</h3>${k.html}</div>`).join("");
    $("mistakes").innerHTML = L.mistakes.map(m => `<li>${m}</li>`).join("");
    document.querySelectorAll(".lang button").forEach(b =>
      b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));

    list.innerHTML = L.steps.map((s, i) => `<li class="step" id="s${i}">
        <label class="tick">
          <input type="checkbox" data-i="${i}" aria-label="${L.step} ${i + 1}: ${s.short}">
          <span class="badge" aria-hidden="true">${i + 1}${checkSvg}</span>
          <span class="body"><span class="kicker">${L.step} ${i + 1}<span class="mark"></span></span>${s.html}</span>
        </label>
        <button type="button" class="peek" data-shot="${i}" aria-label="${L.showAria(i + 1)}">
          <img src="${thumb(i)}" alt="${s.alt}" loading="lazy" decoding="async" width="640" height="326">
          ${boxes(i, "hs")}
          <span class="cta" aria-hidden="true"><i>+</i>${L.showMe}</span>
        </button>
      </li>`).join("");
    updateProgress();
    $("v-close").setAttribute("aria-label", L.close);
    $("v-prev").setAttribute("aria-label", L.prev);
    $("v-next").setAttribute("aria-label", L.next);
    $("v-hint").textContent = L.hint;
  }

  list.addEventListener("change", e => {
    if (!e.target.matches("input[type=checkbox]")) return;
    const i = +e.target.dataset.i;
    done = e.target.checked ? [...new Set([...done, i])] : done.filter(x => x !== i);
    save();
    updateProgress();
  });
  $("reset").addEventListener("click", () => { done = []; save(); updateProgress(); });
  document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => {
    lang = b.dataset.lang;
    try { localStorage.setItem(LKEY, lang); } catch (e) {}
    render();
  }));

  /* ---------- Screenshot viewer ---------- */
  const viewer = $("viewer"), stage = $("v-stage"), img = $("v-img"), spotsEl = $("v-spots");
  const prevBtn = $("v-prev"), nextBtn = $("v-next"), closeBtn = $("v-close");
  let cur = 0, lo = 0, hi = STEPS - 1, opener = null;
  const caption = i => {
    const L = LANGS[lang];
    return i < STEPS ? { count: L.stepOf(i + 1, STEPS), text: L.steps[i].short, alt: L.steps[i].alt }
                     : { count: L.followStepOf, text: L.followShort, alt: L.followAlt };
  };

  function show(i) {
    cur = Math.max(lo, Math.min(hi, i));
    const s = caption(cur), src = full(cur);
    stage.classList.add("loading");
    const ready = () => stage.classList.remove("loading");
    img.onload = ready;
    img.alt = s.alt;
    img.src = src;
    if (img.complete && img.naturalWidth) ready();
    /* Each highlight is a percentage-positioned window holding an undimmed copy of the
       screenshot, scaled and offset so it lines up exactly with the dimmed image below. */
    spotsEl.innerHTML = SHOTS[cur].spots.map(([l, t, w, h]) =>
      `<div class="spot" style="left:${l}%;top:${t}%;width:${w}%;height:${h}%">` +
      `<img src="${src}" alt="" aria-hidden="true" style="width:${10000 / w}%;height:${10000 / h}%;left:${-l / w * 100}%;top:${-t / h * 100}%"></div>`
    ).join("");
    $("v-count").textContent = s.count;
    $("v-text").textContent = s.text;
    prevBtn.disabled = cur === lo;
    nextBtn.disabled = cur === hi;
    if (document.activeElement === document.body) closeBtn.focus();
    [cur - 1, cur + 1].forEach(j => { if (j >= lo && j <= hi) new Image().src = full(j); });
  }

  function open(i, from) {
    opener = from || document.activeElement;
    [lo, hi] = i < STEPS ? [0, STEPS - 1] : [i, i];
    viewer.classList.toggle("single", lo === hi);
    viewer.hidden = false;
    document.body.classList.add("locked");
    $("main").inert = true;
    document.querySelector(".site-head").inert = true;
    show(i);
    (cur < hi ? nextBtn : closeBtn).focus();
  }

  function close() {
    viewer.hidden = true;
    document.body.classList.remove("locked");
    $("main").inert = false;
    document.querySelector(".site-head").inert = false;
    img.removeAttribute("src");
    if (opener && opener.isConnected) opener.focus();
    else { const b = document.querySelector(`[data-shot="${cur}"]`); if (b) b.focus(); }
  }

  function go(d) {
    const j = cur + d;
    if (j < lo || j > hi) return;
    show(j);
    /* keep focus on a usable control when an arrow becomes disabled */
    if (document.activeElement && document.activeElement.disabled) (d < 0 ? nextBtn : prevBtn).focus();
  }

  $("main").addEventListener("click", e => {
    const b = e.target.closest(".peek");
    if (b) open(+b.dataset.shot, b);
  });
  prevBtn.addEventListener("click", () => go(-1));
  nextBtn.addEventListener("click", () => go(1));
  closeBtn.addEventListener("click", close);
  $("v-backdrop").addEventListener("click", close);
  viewer.addEventListener("click", e => { if (e.target === viewer || e.target.classList.contains("dialog")) close(); });

  document.addEventListener("keydown", e => {
    if (viewer.hidden) return;
    if (e.key === "Escape") { e.preventDefault(); close(); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); go(-1); }
    else if (e.key === "ArrowRight") { e.preventDefault(); go(1); }
    else if (e.key === "Tab") {
      const f = [closeBtn, prevBtn, nextBtn].filter(b => !b.disabled);
      const k = f.indexOf(document.activeElement);
      e.preventDefault();
      const n = k === -1 ? 0 : (k + (e.shiftKey ? -1 : 1) + f.length) % f.length;
      f[n].focus();
    }
  });

  /* Swipe left/right on touch screens */
  let tx = null, ty = null;
  stage.addEventListener("touchstart", e => { const t = e.changedTouches[0]; tx = t.clientX; ty = t.clientY; }, { passive: true });
  stage.addEventListener("touchend", e => {
    if (tx === null) return;
    const t = e.changedTouches[0], dx = t.clientX - tx, dy = t.clientY - ty;
    tx = ty = null;
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy) * 1.2) go(dx < 0 ? 1 : -1);
  }, { passive: true });

  render();
</script>
</body>
</html>
